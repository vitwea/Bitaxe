<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Bitaxe Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">

<style>
body {
  font-family: 'Inter', sans-serif;
  background: #0d0d0f;
  color: #e5e5e5;
  margin: 0;
  padding: 20px;
}

h1 {
  text-align: center;
  font-weight: 700;
  margin-bottom: 30px;
  color: #00eaff;
}

.container {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 20px;
}

.card {
  background: linear-gradient(145deg, #141418, #0b0b0d);
  padding: 20px;
  border-radius: 12px;
  box-shadow: 0 0 15px rgba(0, 255, 255, 0.1);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.card:hover {
  transform: translateY(-4px);
  box-shadow: 0 0 25px rgba(0, 255, 255, 0.25);
}

.card h2 {
  margin-top: 0;
  font-size: 1.3rem;
  color: #00eaff;
}

.value {
  font-size: 1.8rem;
  font-weight: 700;
  margin-top: 10px;
}

.sub {
  opacity: 0.7;
  margin-top: 5px;
}

.footer {
  text-align: center;
  margin-top: 40px;
  opacity: 0.5;
  font-size: 0.9rem;
}
</style>
</head>

<body>

<h1>Bitaxe Dashboard · CKPool</h1>

<div class="container">
  <div class="card">
    <h2>Hashrate</h2>
    <div id="hashrate" class="value">Cargando...</div>
    <div id="hashrate_sub" class="sub"></div>
  </div>

  <div class="card">
    <h2>Shares</h2>
    <div id="shares" class="value">Cargando...</div>
    <div id="shares_sub" class="sub"></div>
  </div>

  <div class="card">
    <h2>Estado</h2>
    <div id="status" class="value">Cargando...</div>
    <div id="status_sub" class="sub"></div>
  </div>
</div>

<div class="footer">
  Actualizando cada 10 segundos · solo.ckpool.org
</div>

<script>
async function loadData() {
  try {
    const res = await fetch("https://solo.ckpool.org/users/bc1qz8yh0y2wr4jdfmydcwpcsnl0m2h4k34zg2557j");
    const data = await res.json();

    const worker = data.workers[0];

    // Hashrate
    document.getElementById("hashrate").innerText =
      (worker.hashrate / 1000).toFixed(2) + " kH/s";

    document.getElementById("hashrate_sub").innerText =
      "Hashrate efectivo";

    // Shares
    document.getElementById("shares").innerText =
      worker.valid + " válidas";

    document.getElementById("shares_sub").innerText =
      "Inválidas: " + worker.invalid;

    // Estado
    document.getElementById("status").innerText =
      worker.lastshare + "s";

    document.getElementById("status_sub").innerText =
      "Última share enviada";
  } catch (e) {
    document.getElementById("status").innerText = "Error";
    document.getElementById("status_sub").innerText = "No se pudo cargar la API";
  }
}

loadData();
setInterval(loadData, 10000);
</script>

</body>
</html>
